# Central configuration for the classical image captioning project.
# All paths are relative to the project root (the directory containing
# configs/) unless they are absolute.

paths:
  raw_data_dir: data/raw/flickr8k
  images_dir: data/raw/flickr8k/Images
  captions_file: data/raw/flickr8k/Flickr8k.token.txt
  train_split_file: data/raw/flickr8k/Flickr_8k.trainImages.txt
  val_split_file: data/raw/flickr8k/Flickr_8k.devImages.txt
  test_split_file: data/raw/flickr8k/Flickr_8k.testImages.txt
  processed_dir: data/processed
  features_dir: data/features
  captions_dir: data/captions
  language_model_dir: data/language_model
  evaluation_dir: data/evaluation

dataset:
  # Flickr8k ships 5 reference captions per image. Used only as an
  # integrity *expectation* for validation warnings; every reported number
  # is computed from the actual files.
  expected_captions_per_image: 5
  image_extensions: [".jpg"]
  # Project-level exclusion of known-defective official entries. The raw
  # source files are NEVER modified: excluded IDs are filtered at load time,
  # reported in every run, and documented in docs/phase1_dataset.md
  # (appendix, sections 12-13). Every entry requires an explicit reason.
  excluded_images:
    - id: "2258277193_586949ec62.jpg.1"
      reason: >-
        Captioned five times in the official Flickr8k.token.txt but absent
        from the official Flickr8k_Dataset.zip (CRC-verified; byte-size
        identical to the canonical release). Known upstream dataset defect
        also dropped by published pipelines. Decision recorded in
        docs/phase1_dataset.md, sections 12-13.

validation:
  # If true, every image file is opened once with PIL to detect corruption
  # (header verification, no full pixel decode). Set to false for a quick
  # filename-only run.
  verify_image_contents: true

report:
  json_report: data/processed/dataset_report.json
  markdown_report: data/processed/dataset_report.md
